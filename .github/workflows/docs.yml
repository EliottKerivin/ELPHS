# For now only publishes algea docs, can be modified later
name: Publish docs to pages
on: 
  push:
    branches: [ main ]
env:
  build_directory: ${{github.workspace}}/build
  docs_target: docs
  docs_dir: ${{github.workspace}}/docs
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt install doxygen 
      - uses: actions/checkout@v7
      - run: cmake -B ${{env.build_directory}} -DDOXYGEN_OUTPUT_DIRECTORY=${{env.docs_dir}}
      - run: cmake --build ${{env.build_directory}} -t ${{env.docs_target}}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{env.docs_dir}}

  deploy:    
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
    
      
